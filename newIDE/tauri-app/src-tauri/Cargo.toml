[package]
name = "gdevelop"
version = "5.6.284"
description = "GDevelop 5 IDE - the open-source, cross-platform game engine designed for everyone"
authors = ["GDevelop Team <hello@gdevelop.io>"]
license = "MIT"
homepage = "https://gdevelop.io"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# `protocol-asset` is required for `app.asset_protocol_scope()` (scope.rs) and for
# the JS-side `convertFileSrc` used by TauriBridge.getResourceUrl(Sync).
tauri = { version = "2.12.4", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
# Verbose diagnostics for the MVP build: writes Rust + forwarded webview
# console output to a log file (and stdout in debug builds) so a tester can
# report "what actually happened" without attaching a debugger.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async HTTP client for flush_export's filesToDownload. rustls-tls avoids a
# system OpenSSL build dependency.
# `rustls-tls-native-roots` (OS trust store via `rustls-native-certs`)
# instead of `rustls-tls` (= bundled webpki-roots). NOTE: this was shipped
# as the fix for resources.gdevelop-app.com failing on Windows and did NOT
# fix it - that failure is a 30s connection hang, not a certificate error
# (see `Ipv4PreferringResolver` in src/http_fetch.rs). Kept since it works
# for api.gdevelop.io and matches what the OS trusts.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
# http_fetch.rs base64-encodes request/response bodies crossing the JS/Rust
# boundary uniformly, so neither side has to guess text vs. binary.
base64 = "0.22"
